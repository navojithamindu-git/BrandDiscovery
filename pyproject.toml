[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-discovery"
version = "0.1.0"
description = "Proof of concept for authorized Facebook and Instagram collection"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  "apscheduler>=3.10,<4",
  "cryptography>=42,<48",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

